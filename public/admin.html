<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>blue-blog 后台</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="wrap head-inner">
    <button class="logo" onclick="location.reload()">blue-blog 后台</button>
    <nav class="nav hidden" id="tabs">
      <button data-tab="overview" class="active">概览</button>
      <button data-tab="posts">文章</button>
      <button data-tab="comments">评论</button>
      <button data-tab="users">用户</button>
      <button data-tab="shop">商品</button>
      <button data-tab="settings">设置</button>
      <button id="btnLogout" class="danger">退出</button>
    </nav>
  </div>
</header>

<div class="wrap">
  <div id="loginCard" class="box auth-box">
    <h3>管理员登录</h3>
    <input id="aUser" placeholder="用户名">
    <input id="aPass" type="password" placeholder="密码">
    <button id="btnAdminLogin" class="primary" style="width:100%">登录</button>
    <p class="hint" id="loginErr"></p>
  </div>

  <div id="dash" class="hidden">
    <div id="tabOverview">
      <div id="statCards" class="statcards" style="margin-top:20px"></div>
    </div>
    <div id="tabPosts" class="hidden"></div>
    <div id="tabComments" class="hidden"></div>
    <div id="tabUsers" class="hidden"></div>
    <div id="tabShop" class="hidden"></div>
    <div id="tabSettings" class="hidden">
      <div class="box" style="margin-top:20px">
        <h3>探针数据源</h3>
        <p class="hint">支持 komari、哪吒（Nezha v0）、ServerStatus（Hotaru）。可同时添加多个面板。</p>
        <div id="srcRows"></div>
        <div class="row">
          <button id="btnAddSrc">添加数据源</button>
          <button id="btnSaveSettings" class="primary">保存</button>
        </div>
        <p class="hint" id="settingsMsg"></p>
      </div>
    </div>
  </div>
</div>

<script src="/admin.js"></script>
</body>
</html>
