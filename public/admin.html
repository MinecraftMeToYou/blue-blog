<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>后台 · MinecraftMeToYou的私人博客</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="wrap head-inner">
    <button class="logo" onclick="location.reload()">博客后台</button>
    <nav class="nav hidden" id="tabs">
      <button data-tab="overview" class="active">概览</button>
      <button data-tab="posts">文章</button>
      <button data-tab="comments">评论</button>
      <button data-tab="users">用户</button>
      <button data-tab="invites">邀请码</button>
      <button data-tab="shop">商品</button>
      <button data-tab="settings">设置</button>
      <button id="btnLogout" class="danger">退出</button>
    </nav>
  </div>
</header>

<div class="wrap">
  <div id="loginCard" class="box auth-box">
    <h3>管理员登录</h3>
    <input id="aUser" placeholder="用户名">
    <input id="aPass" type="password" placeholder="密码">
    <button id="btnAdminLogin" class="primary" style="width:100%">登录</button>
    <p class="hint" id="loginErr"></p>
  </div>

  <div id="dash" class="hidden">
    <div id="tabOverview">
      <div id="statCards" class="statcards" style="margin-top:20px"></div>
    </div>
    <div id="tabPosts" class="hidden"></div>
    <div id="tabComments" class="hidden"></div>
    <div id="tabUsers" class="hidden"></div>
    <div id="tabInvites" class="hidden">
      <div class="box" style="margin-top:20px">
        <h3>生成邀请码</h3>
        <div class="row">
          <label>数量 <input id="invCount" type="number" value="5" min="1" max="20" style="width:70px"></label>
          <label>每码可用次数 <input id="invUses" type="number" value="1" min="1" style="width:70px"></label>
          <label>有效天数（0=永久） <input id="invDays" type="number" value="7" min="0" style="width:80px"></label>
          <button id="btnGenInvites" class="primary">生成</button>
        </div>
      </div>
      <div id="inviteList"></div>
    </div>
    <div id="tabShop" class="hidden"></div>
    <div id="tabSettings" class="hidden">
      <div class="box" style="margin-top:20px">
        <h3>站点</h3>
        <p class="hint">站点名称，显示在导航栏和浏览器标题</p>
        <input id="siteNameInput" placeholder="站点名称">
        <div class="row"><button id="btnSaveSite" class="primary">保存站名</button></div>
        <p class="hint" id="siteMsg"></p>
      </div>
      <div class="box">
        <h3>注册与验证</h3>
        <div class="row" style="gap:20px">
          <label><input type="checkbox" id="regInvite" style="width:auto;margin:0 6px 0 0">注册需要邀请码</label>
          <label><input type="checkbox" id="regEmail" style="width:auto;margin:0 6px 0 0">邮箱验证（SMTP）</label>
          <label><input type="checkbox" id="regPhone" style="width:auto;margin:0 6px 0 0">手机号验证</label>
          <label><input type="checkbox" id="regQQ" style="width:auto;margin:0 6px 0 0">允许绑定 QQ</label>
        </div>
        <p class="hint">开启邮箱/手机验证后，用户完成验证前无法发帖、评论、抽奖和购买（管理员不受限）</p>
        <div class="row"><button id="btnSaveReg" class="primary">保存注册开关</button><span class="hint" id="regMsg"></span></div>
      </div>
      <div class="box">
        <h3>SMTP 邮件服务</h3>
        <div class="row" style="flex-wrap:nowrap">
          <input id="smtpHost" placeholder="SMTP 服务器，如 smtp.qq.com" style="flex:2">
          <input id="smtpPort" type="number" placeholder="端口" style="width:90px">
          <label style="white-space:nowrap"><input type="checkbox" id="smtpSecure" style="width:auto;margin:0 6px 0 0">SSL</label>
        </div>
        <div class="row" style="flex-wrap:nowrap">
          <input id="smtpUser" placeholder="账号" style="flex:1">
          <input id="smtpPass" type="password" placeholder="密码/授权码" style="flex:1">
          <input id="smtpFrom" placeholder="发件人邮箱" style="flex:1">
        </div>
        <div class="row" style="flex-wrap:nowrap">
          <button id="btnSaveSmtp" class="primary">保存 SMTP</button>
          <input id="smtpTestTo" placeholder="测试收件邮箱（留空发给自己）" style="flex:1">
          <button id="btnTestSmtp">发送测试邮件</button>
        </div>
        <p class="hint" id="smtpMsg"></p>
      </div>
      <div class="box">
        <h3>短信通道（webhook）</h3>
        <p class="hint">验证码会 POST {phone, code} 到该地址，由你的短信服务转发下发；阿里云/腾讯云短信可用一个转发函数对接</p>
        <div class="row" style="flex-wrap:nowrap">
          <input id="smsWebhook" placeholder="https://你的短信转发地址" style="flex:1">
          <button id="btnSaveSms" class="primary">保存</button>
        </div>
        <p class="hint" id="smsMsg"></p>
      </div>
      <div class="box">
        <h3>探针数据源</h3>
        <p class="hint">支持 komari、哪吒（Nezha v0）、ServerStatus（Hotaru）。可同时添加多个面板。</p>
        <div id="srcRows"></div>
        <div class="row">
          <button id="btnAddSrc">添加数据源</button>
          <button id="btnSaveSettings" class="primary">保存</button>
        </div>
        <p class="hint" id="settingsMsg"></p>
      </div>
    </div>
  </div>
</div>

<script src="/admin.js"></script>
</body>
</html>
