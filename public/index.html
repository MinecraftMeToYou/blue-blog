<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>blue-blog</title>
<link rel="stylesheet" href="/style.css">
<style id="userTheme"></style>
</head>
<body>
<header>
  <div class="wrap head-inner">
    <button class="logo" onclick="showTab('posts')">blue-blog</button>
    <nav class="nav">
      <button data-tab="posts" class="active">文章</button>
      <button data-tab="shop">商店</button>
      <button data-tab="lottery">抽奖</button>
      <button data-tab="mc">MC状态</button>
      <button data-tab="themes">主题</button>
      <button data-tab="probe">机器状态</button>
      <button id="navMachines" class="machchip" title="探针节点在线情况">--</button>
      <button data-tab="auth" id="navAuth">登录</button>
      <span id="userBox"></span>
    </nav>
  </div>
</header>

<div class="wrap">
  <!-- 文章列表（话题列表） -->
  <section id="postsPanel" class="hidden">
    <div id="tagBar" class="pills"></div>
    <table class="topics">
      <thead>
        <tr><th class="c-topic">主题</th><th class="c-poster">发起人</th><th class="c-num">回复</th><th class="c-act">活动</th></tr>
      </thead>
      <tbody id="postList"></tbody>
    </table>
    <div id="editorCard" class="box hidden">
      <h3 id="editorTitle">新话题</h3>
      <input id="postTitle" placeholder="标题">
      <textarea id="postContent" rows="6" placeholder="内容..."></textarea>
      <div class="row">
        <input id="postTags" placeholder="标签（逗号分隔）" style="flex:1">
        <input id="postCategory" placeholder="分类" style="flex:1">
      </div>
      <div class="row">
        <button id="btnPublish" class="primary">发布</button>
        <button id="btnCancelEdit" class="hidden">取消</button>
      </div>
    </div>
    <p style="margin:16px 0"><button id="btnNewPost" class="primary hidden">+ 新话题</button></p>
  </section>

  <!-- 登录/注册 -->
  <section id="authPanel" class="hidden">
    <div class="box auth-box">
      <h3>登录</h3>
      <input id="authUser" placeholder="用户名">
      <input id="authPass" type="password" placeholder="密码">
      <div class="row">
        <button id="btnLogin" class="primary">登录</button>
        <button id="btnRegister">注册</button>
      </div>
      <p class="hint">没有账号？点「注册」，送 100 金币</p>
    </div>
  </section>

  <!-- 话题详情 -->
  <section id="postDetail" class="hidden"></section>

  <!-- 商店 -->
  <section id="shopPanel" class="hidden">
    <p id="shopCoins" class="sub-head"></p>
    <div id="shopList"></div>
    <h3 class="sec-title">订单</h3>
    <div id="orderList"></div>
  </section>

  <!-- 抽奖 -->
  <section id="lotteryPanel" class="hidden">
    <div class="box" style="text-align:center">
      <h3>抽奖</h3>
      <p class="hint">每次消耗 20 金币，抽中头衔会覆盖当前头衔</p>
      <div id="poolList" class="pool"></div>
      <button id="btnDraw" class="primary" style="font-size:15px;padding:10px 36px">抽一次（20 金币）</button>
      <p id="drawResult" style="font-size:16px;margin-top:14px;min-height:1.5em"></p>
    </div>
    <div class="box">
      <h3>我的抽奖记录</h3>
      <div id="drawHistory"></div>
    </div>
  </section>

  <!-- 主题 -->
  <section id="themesPanel" class="hidden">
    <div id="themeList"></div>
    <div id="themeEditor" class="box hidden">
      <h3 id="themeEditorTitle">编写主题</h3>
      <input id="themeName" placeholder="主题名称">
      <textarea id="themeCSS" rows="12" spellcheck="false" placeholder="/* 在这里编写你的 CSS，可覆盖变量：--blue 等 */"></textarea>
      <div class="row">
        <button id="btnThemeSave" class="primary">保存主题</button>
        <button id="btnThemePreview">实时预览</button>
        <button id="btnThemeReset">还原当前主题</button>
        <button id="btnThemeCancel">收起</button>
      </div>
      <p class="hint">预览仅对本机生效；保存后所有人可用你的主题。支持覆盖 CSS 变量（--blue、--text 等）或写任意选择器。</p>
    </div>
  </section>

  <!-- 机器状态 -->
  <section id="probePanel" class="hidden">
    <div class="row" style="justify-content:space-between">
      <p id="probeHint" class="hint" style="margin:0"></p>
      <button id="btnRefreshProbe">刷新</button>
    </div>
    <div id="probeList"></div>
  </section>

  <!-- MC -->
  <section id="mcPanel" class="hidden">
    <button id="btnRefreshMc">刷新</button>
    <div id="mcList"></div>
  </section>
</div>

<footer>Powered by blue-blog</footer>
<script src="/app.js"></script>
</body>
</html>
