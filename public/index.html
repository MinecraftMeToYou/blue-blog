<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MinecraftMeToYou的私人博客</title>
<link rel="stylesheet" href="/style.css">
<style id="userTheme"></style>
</head>
<body>
<header>
  <div class="wrap head-inner">
    <button class="logo" id="logoBtn" onclick="showTab('posts')">MinecraftMeToYou的私人博客</button>
    <nav class="nav">
      <button data-tab="posts" class="active">文章</button>
      <div class="nav-drop" id="moreDrop">
        <button id="btnMore">其他 ▾</button>
        <div class="drop-menu hidden" id="moreMenu">
          <button data-tab="shop">商店</button>
          <button data-tab="lottery">抽奖</button>
          <button data-tab="mc">MC状态</button>
          <button data-tab="probe">机器状态</button>
        </div>
      </div>
      <button data-tab="themes">主题</button>
      <button id="navDayNight" class="daynight" title="切换白天/夜晚">🌙 夜晚</button>
      <button id="navMachines" class="machchip" title="探针节点在线情况">--</button>
      <button data-tab="auth" id="navAuth">登录</button>
      <span id="userBox"></span>
    </nav>
  </div>
</header>

<div class="wrap">
  <!-- 文章列表（话题列表） -->
  <section id="postsPanel" class="hidden">
    <div id="tagBar" class="pills"></div>
    <table class="topics">
      <thead>
        <tr><th class="c-topic">主题</th><th class="c-poster">发起人</th><th class="c-num">回复</th><th class="c-act">活动</th></tr>
      </thead>
      <tbody id="postList"></tbody>
    </table>
    <div id="editorCard" class="box hidden">
      <h3 id="editorTitle">新话题</h3>
      <input id="postTitle" placeholder="标题">
      <textarea id="postContent" rows="6" placeholder="内容..."></textarea>
      <div class="row">
        <input id="postTags" placeholder="标签（逗号分隔）" style="flex:1">
        <input id="postCategory" placeholder="分类" style="flex:1">
      </div>
      <div class="row">
        <button id="btnPublish" class="primary">发布</button>
        <button id="btnCancelEdit" class="hidden">取消</button>
      </div>
      <p class="hint">正文中可用标记：[probe] 机器状态、[mc] MC状态、[lottery] 抽奖、[shop] 商店，发布后自动渲染成对应组件</p>
    </div>
    <p style="margin:16px 0"><button id="btnNewPost" class="primary hidden">+ 新话题</button></p>
  </section>

  <!-- 登录/注册 / 个人设置 -->
  <section id="authPanel" class="hidden">
    <div class="box auth-box">
      <div id="authForms">
        <h3>登录</h3>
        <input id="authUser" placeholder="用户名">
        <input id="authPass" type="password" placeholder="密码">
        <div class="row">
          <button id="btnLogin" class="primary">登录</button>
          <button id="btnRegister">注册</button>
        </div>
        <div class="row reg-extra hidden" id="regEmailRow"><input id="regEmail" placeholder="邮箱" style="flex:1"></div>
        <div class="row reg-extra hidden" id="regPhoneRow"><input id="regPhone" placeholder="手机号" style="flex:1"></div>
        <div class="row reg-extra hidden" id="regInviteRow"><input id="regInvite" placeholder="邀请码" style="flex:1"></div>
        <p class="hint">没有账号？点「注册」，送 100 金币</p>
      </div>
      <div id="profileBox" class="hidden">
        <h3>个人设置 <span id="profLevel"></span></h3>
        <p class="hint" id="profName"></p>
        <h4 class="p-sec">邮箱</h4>
        <div class="row" style="flex-wrap:nowrap">
          <input id="profEmail" placeholder="邮箱地址" style="flex:1;margin:0">
          <button id="btnProfEmailSend">发送验证码</button>
        </div>
        <div class="row" style="flex-wrap:nowrap">
          <input id="profEmailCode" placeholder="6 位验证码" style="width:130px;margin:0">
          <button id="btnProfEmailConfirm" class="primary">确认</button>
          <span class="hint" id="profEmailState"></span>
        </div>
        <h4 class="p-sec">手机号</h4>
        <div class="row" style="flex-wrap:nowrap">
          <input id="profPhone" placeholder="手机号" style="flex:1;margin:0">
          <button id="btnProfPhoneSend">发送验证码</button>
        </div>
        <div class="row" style="flex-wrap:nowrap">
          <input id="profPhoneCode" placeholder="6 位验证码" style="width:130px;margin:0">
          <button id="btnProfPhoneConfirm" class="primary">确认</button>
          <span class="hint" id="profPhoneState"></span>
        </div>
        <h4 class="p-sec" id="qqSec">QQ 绑定</h4>
        <div class="row" style="flex-wrap:nowrap" id="qqRow">
          <input id="profQQ" placeholder="QQ 号" style="width:180px;margin:0">
          <button id="btnProfQQ" class="primary">保存</button>
          <span class="hint" id="profQQState"></span>
        </div>
        <div class="row" style="justify-content:space-between;margin-top:18px">
          <button id="btnBackForum" class="link-btn">← 回到论坛</button>
          <button id="btnProfLogout" class="danger">退出登录</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 话题详情 -->
  <section id="postDetail" class="hidden"></section>

  <!-- 商店 -->
  <section id="shopPanel" class="hidden">
    <p id="shopCoins" class="sub-head"></p>
    <div id="shopList"></div>
    <h3 class="sec-title">订单</h3>
    <div id="orderList"></div>
  </section>

  <!-- 抽奖 -->
  <section id="lotteryPanel" class="hidden">
    <div class="box">
      <h3>抽奖</h3>
      <p class="hint">每次消耗 20 金币，抽中头衔会覆盖当前头衔</p>
      <div id="lotteryBody"></div>
    </div>
    <div class="box">
      <h3>我的抽奖记录</h3>
      <div id="drawHistory"></div>
    </div>
  </section>

  <!-- 主题 -->
  <section id="themesPanel" class="hidden">
    <div id="themeList"></div>
    <div id="themeEditor" class="box hidden">
      <h3 id="themeEditorTitle">编写主题</h3>
      <input id="themeName" placeholder="主题名称">
      <textarea id="themeCSS" rows="12" spellcheck="false" placeholder="/* 在这里编写你的 CSS，可覆盖变量：--blue 等 */"></textarea>
      <div class="row">
        <button id="btnThemeSave" class="primary">保存主题</button>
        <button id="btnThemePreview">实时预览</button>
        <button id="btnThemeReset">还原当前主题</button>
        <button id="btnThemeCancel">收起</button>
      </div>
      <p class="hint">预览仅对本机生效；保存后所有人可用你的主题。支持覆盖 CSS 变量（--blue、--text 等）或写任意选择器。</p>
    </div>
  </section>

  <!-- 机器状态 -->
  <section id="probePanel" class="hidden">
    <div class="row" style="justify-content:space-between">
      <p id="probeHint" class="hint" style="margin:0"></p>
      <button id="btnRefreshProbe">刷新</button>
    </div>
    <div id="probeList"></div>
  </section>

  <!-- MC -->
  <section id="mcPanel" class="hidden">
    <button id="btnRefreshMc">刷新</button>
    <div id="mcList"></div>
  </section>
</div>

<footer>MinecraftMeToYou的私人博客</footer>
<script src="/app.js"></script>
</body>
</html>
